<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดบันทึกการสอน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bai+Jamjuree:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* Layout: register-book app — sticky class bar on top, tabs, one working surface per tab */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#18233a; --muted:#5d6a80; --line:#d8dee8; --soft:#eaeef5;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e1ebf7;
  --ok:#1f7a4d; --ok-bg:#dff3e8; --late:#9a6a00; --late-bg:#fbf0d2; --leave:#4b5bb5; --leave-bg:#e5e8fa; --abs:#b3261e; --abs-bg:#fbe2e0;
  --f-display:"Bai Jamjuree","Sarabun",system-ui,sans-serif; --f-body:"Sarabun",system-ui,"Leelawadee UI","Tahoma",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#171f2d; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2b3546; --soft:#1e2838;
  --accent:#7fb0ea; --accent-ink:#0b1424; --accent-soft:#1c2f4a;
  --ok:#6fd3a0; --ok-bg:#163a2a; --late:#e8c060; --late-bg:#3a2f12; --leave:#a8b3ff; --leave-bg:#252b52; --abs:#ff8f86; --abs-bg:#47201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#171f2d; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2b3546; --soft:#1e2838;
  --accent:#7fb0ea; --accent-ink:#0b1424; --accent-soft:#1c2f4a;
  --ok:#6fd3a0; --ok-bg:#163a2a; --late:#e8c060; --late-bg:#3a2f12; --leave:#a8b3ff; --leave-bg:#252b52; --abs:#ff8f86; --abs-bg:#47201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{font:600 18px/1.2 var(--f-display);display:block}
.brand small{color:var(--muted);font-size:12.5px}
.clsbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=password],textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--abs)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13.5px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:18px 60px}
h2{font:600 21px/1.3 var(--f-display);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select{color:var(--ink);font-size:15px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
/* week strip */
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wk{min-width:42px;padding:4px 0 2px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;text-align:center;font-variant-numeric:tabular-nums}
.wk small{display:block;font-size:10.5px;color:var(--muted);line-height:1}
.wk.done{background:var(--ok-bg);border-color:transparent}
.wk.cur{outline:2px solid var(--accent);outline-offset:1px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-late{background:var(--late-bg);color:var(--late)} .c-leave{background:var(--leave-bg);color:var(--leave)} .c-abs{background:var(--abs-bg);color:var(--abs)} .c-none{background:var(--soft);color:var(--muted)}
.roll{display:flex;flex-direction:column}
.roll .st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--soft)}
.roll .no{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.roll .nm small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.seg button.on.late{background:var(--late);border-color:var(--late);color:var(--paper)}
.seg button.on.leave{background:var(--leave);border-color:var(--leave);color:var(--paper)}
.seg button.on.abs{background:var(--abs);border-color:var(--abs);color:var(--paper)}
/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table.t{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:3px 5px;text-align:center;white-space:nowrap}
table.t th{background:var(--soft);font-weight:600;position:sticky;top:0}
table.t td.l,table.t th.l{text-align:left}
table.t .stick{position:sticky;left:0;background:var(--paper);z-index:1}
table.t th.stick{z-index:3;background:var(--soft)}
table.t input{width:38px;padding:2px 3px;text-align:center;border-radius:4px;border:1px solid transparent;background:transparent}
table.t input:hover{border-color:var(--line)}
table.t input.mo{width:64px;font-weight:600}
table.t td.tot{font-weight:700;background:var(--accent-soft)}
.cell{cursor:pointer;min-width:26px;font-weight:600}
.cell.ok{color:var(--ok)} .cell.late{color:var(--late);background:var(--late-bg)} .cell.leave{color:var(--leave);background:var(--leave-bg)} .cell.abs{color:var(--abs);background:var(--abs-bg)}
.vert{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;font-size:12.5px;padding:4px 0;max-height:150px}
/* notes */
.notes{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.notes{grid-template-columns:1fr}}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;cursor:pointer}
.nitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.nitem b{display:block;font-size:14px}
.nitem small{color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0}
legend{font-weight:700;padding:0 6px;font-family:var(--f-display)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.lcard{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.lcard .lh{display:flex;gap:12px;align-items:center}.lcard .lh img{width:58px;height:58px}
.lcard .lh b{font:600 21px/1.25 var(--f-display);display:block}
.ltabs{display:flex;gap:4px;background:var(--soft);border-radius:8px;padding:3px}
.ltabs button{flex:1;border:0;background:none;padding:7px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.ltabs button.on{background:var(--paper);color:var(--accent)}
.lerr{color:var(--abs);font-size:13.5px;min-height:1.2em;margin:0}
.userchip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.userchip b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-weight:600;transition:opacity .2s}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ex-tag{display:inline-block;background:var(--late-bg);color:var(--late);font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
/* ---- PDF page (fixed print colours, independent of theme) ---- */
#pdfStage{position:fixed;left:-10000px;top:0}
.a4{width:210mm;min-height:296mm;padding:14mm 18mm 12mm 22mm;background:#fff;color:#000;font:14.5px/1.62 "Sarabun",sans-serif;position:relative}
.a4 .h10{font-weight:700}
.a4 .ttl{font-weight:700;font-size:19px;text-align:center;margin:2px 0 6px}
.a4 .wkno{position:absolute;right:18mm;top:14mm}
.a4 .ln{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.a4 .fill{display:inline-block;border-bottom:1px dotted #000;min-width:40px;padding:0 6px;text-align:center;line-height:1.35}
.a4 .fill.w{flex:1;text-align:left}
.a4 .sec{font-weight:700;margin-top:6px}
.a4 .ind{padding-left:26px}
.a4 .ind2{padding-left:44px;display:grid;grid-template-columns:repeat(var(--cols,3),auto);gap:0 18px;justify-content:start}
.a4 .cb{display:inline-flex;align-items:baseline;gap:6px}
.a4 .box{display:inline-block;width:13px;height:13px;border:1.2px solid #000;position:relative;top:2px;flex:none}
.a4 .box.x::after{content:"";position:absolute;left:3.5px;top:0;width:4px;height:8px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.a4 .para{border-bottom:1px dotted #000;min-height:24px;padding:0 4px;white-space:pre-wrap;line-height:1.75}
.a4 .sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px;margin-top:22px;text-align:center}
.a4 .sigs .c3{grid-column:1 / -1;justify-self:center;min-width:50%}
.a4 .sigs .dots{display:inline-block;border-bottom:1px dotted #000;width:160px}
.pg-break{page-break-before:always}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="wrap login" id="loginView" hidden></section>
<header class="top" id="appHeader" hidden>
  <div class="wrap topin">
    <div class="brand"><img id="brandLogo" alt="ตราวิทยาลัย"><div><b>สมุดบันทึกการสอน</b><small id="brandSub"></small></div></div>
    <div class="clsbar">
      <select id="termSel" aria-label="ภาคเรียน/ปีการศึกษา"></select>
      <select id="clsSel" aria-label="เลือกรายวิชา/กลุ่มเรียน"></select>
      <button class="btn" id="addCls">+ เพิ่มวิชา</button>
      <button class="btn pri" id="xlsBtn">ดาวน์โหลด Excel</button>
      <span class="userchip"><span>ผู้ใช้ <b id="userName"></b></span><button class="btn sm" id="logoutBtn">ออกจากระบบ</button></span>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main class="wrap" id="view" hidden></main>
<div id="pdfStage"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="logoIn" accept="image/*" hidden>

function attOf(c,s,w){return (c.att[s.id]||{})[w]||''}
function attTotal(c,s){let n=0;for(let w=1;w<=WEEKS;w++){const v=attOf(c,s,w);if(v==='/'||v==='ส')n++}return n}

function weekCounts(c,w){const r={'/':0,'ส':0,'ล':0,'ข':0,'':0};c.students.forEach(s=>r[attOf(c,s,w)]++);return r}

function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(2)}
const fmt1=n=>String(Math.round(n*10)/10);

function shortDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return `${d} ${TH_SHORT[m-1]} ${String(y+543).slice(2)}`}
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
/* ---------- risk ---------- */
function heldWeeks(c){const r=[];for(let w=1;w<=WEEKS;w++)if(c.students.some(s=>attOf(c,s,w)))r.push(w);return r}
function usedCols(c){const r=[];for(let i=0;i<MONTHS*PER;i++)if(c.students.some(s=>{const v=(c.scores[s.id]||{})[i];return v!==''&&v!=null}))r.push(i);return r}
function riskOf(c,s,held=heldWeeks(c),used=usedCols(c)){
  const R=S.settings.risk;let pres=0,abs=0,leave=0,run=0,maxRun=0;
  held.forEach(w=>{const a=attOf(c,s,w);if(a==='/'||a==='ส')pres++;if(a==='ข'){abs++;run++;maxRun=Math.max(maxRun,run)}else run=0;if(a==='ล')leave++});
  const attPct=held.length?pres*100/held.length:null;
  const o=c.scores[s.id]||{};const missing=used.filter(i=>o[i]===''||o[i]==null).length;
  const maxSum=used.reduce((t,i)=>t+num(c.maxes[i]),0),got=used.reduce((t,i)=>t+num(o[i]),0);const scPct=maxSum>0?got*100/maxSum:null;
  const af=affectTot(c,s).score;const reasons=[];let level=0;const up=l=>{level=Math.max(level,l)};
  if(attPct!=null&&attPct<R.att){reasons.push(`เวลาเรียน ${fmt1(attPct)}% ต่ำกว่าเกณฑ์ ${R.att}% (เสี่ยงหมดสิทธิ์สอบ)`);up(2)}
  else if(attPct!=null&&held.length>=3&&attPct<R.att+10){reasons.push(`เวลาเรียน ${fmt1(attPct)}% ใกล้เกณฑ์`);up(1)}
  if(maxRun>=R.run){reasons.push(`ขาดเรียนติดต่อกัน ${maxRun} สัปดาห์`);up(maxRun>R.run?2:1)}
  if(missing>=R.missing){reasons.push(`ค้างงาน/ไม่มีคะแนน ${missing} ชิ้น`);up(missing>=R.missing*2?2:1)}
  if(scPct!=null&&scPct<R.score){reasons.push(`คะแนนเก็บ ${fmt1(scPct)}% ต่ำกว่าเกณฑ์ ${R.score}%`);up(2)}
  if(af!==''&&af<R.affect){reasons.push(`จิตพิสัย ${fmt(af)}/20 ต่ำกว่าเกณฑ์`);up(1)}
  return{level,reasons,attPct,abs,leave,missing,scPct,held:held.length,pres}}
function riskList(c){const h=heldWeeks(c),u=usedCols(c);return c.students.map((s,i)=>({s,i,r:riskOf(c,s,h,u)})).filter(x=>x.r.level>0).sort((a,b)=>b.r.level-a.r.level||a.i-b.i)}

    const s=c.students.find(x=>x.id===tr.dataset.row);const a=c.affect[s.id]=c.affect[s.id]||Array(16).fill('');a[+t.dataset.af]=val===''?'':+val;

  </div>
  <div class="panel stack">
   <div class="row" style="justify-content:space-between"><b>รายชื่อนักเรียน (${c.students.length} คน)</b><button class="btn" id="addSt">+ เพิ่มทีละคน</button></div>
   <div class="tscroll"><table class="t" style="width:100%"><thead><tr><th>ที่</th><th class="l">รหัสประจำตัว</th><th class="l">ชื่อ-นามสกุล</th><th></th></tr></thead><tbody id="stB">
    ${c.students.map((s,i)=>`<tr data-row="${s.id}"><td>${i+1}</td><td class="l"><input type="text" data-k="sid" value="${esc(s.sid)}" style="width:130px;text-align:left"></td>

     <td><button class="btn sm" data-up>↑</button> <button class="btn sm danger" data-del>ลบ</button></td></tr>`).join('')}</tbody></table></div>
   <details><summary style="cursor:pointer;font-weight:600">วางรายชื่อจาก Excel ทีละหลายคน</summary>
    <p class="hint">คัดลอก 2 คอลัมน์จาก Excel (รหัสประจำตัว | ชื่อ-นามสกุล) แล้ววางด้านล่าง หนึ่งคนต่อหนึ่งบรรทัด หรือวางแค่ชื่ออย่างเดียวก็ได้</p>
    <textarea id="paste" rows="6" placeholder="69201010001	นายสมชาย ใจดี&#10;69201010002	นางสาวสมหญิง รักเรียน"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="doPaste">เพิ่มรายชื่อ</button><label class="checks"><label><input type="checkbox" id="replace"> แทนที่รายชื่อเดิมทั้งหมด</label></label></div>
   </details>
  </div>
  <div class="panel row" style="justify-content:space-between"><span class="hint">ลบรายวิชานี้รวมถึงคะแนน การเช็คชื่อ และบันทึกหลังสอนทั้งหมด</span><button class="btn danger" id="delCls">ลบรายวิชานี้</button></div></div>`;
  v.querySelectorAll('[data-cf]').forEach(i=>i.oninput=()=>{c[i.dataset.cf]=i.value;if(c.example)c.example=false;renderShell();save()});
  $('#stB').addEventListener('input',e=>{const tr=e.target.closest('[data-row]');const s=c.students.find(x=>x.id===tr.dataset.row);s[e.target.dataset.k]=e.target.value;save()});
  $('#stB').addEventListener('click',e=>{const tr=e.target.closest('[data-row]');if(!tr)return;const i=c.students.findIndex(x=>x.id===tr.dataset.row);
    if(e.target.hasAttribute('data-del')){if(e.target.dataset.sure){c.students.splice(i,1);render()}else{e.target.dataset.sure=1;e.target.textContent='ยืนยันลบ'}}
    if(e.target.hasAttribute('data-up')&&i>0){const[x]=c.students.splice(i,1);c.students.splice(i-1,0,x);render()}});
  $('#addSt').onclick=()=>{c.students.push({id:uid(),sid:'',name:''});render();const ins=v.querySelectorAll('#stB tr:last-child input');ins[0]?.focus()};
  $('#doPaste').onclick=()=>{const lines=$('#paste').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return toast('ยังไม่ได้วางรายชื่อ');
    if($('#replace').checked){c.students=[];c.att={};c.scores={};c.final={};c.affect={}}
    lines.forEach(l=>{const p=l.split(/\t|,|\s{2,}/).map(x=>x.trim()).filter(Boolean);let sid='',name=l;
      if(p.length>=2&&/^\d+$/.test(p[0])){sid=p[0];name=p.slice(1).join(' ')}else if(p.length>=2&&/^\d+$/.test(p[p.length-1])){sid=p.pop();name=p.join(' ')}

    S.classes=S.classes.filter(x=>x.id!==c.id);UI.cls=null;UI.tab='roster';render()};
}

const USERS_KEY='teacherbook.users',LEGACY='teacherbook.v1';
function users(){try{return JSON.parse(LS.get(USERS_KEY))||[]}catch(e){return[]}}
function saveUsers(a){LS.set(USERS_KEY,JSON.stringify(a))}
async function hashPw(pw,salt){if(!(window.crypto&&crypto.subtle))throw new Error('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส ใช้ Chrome หรือ Edge รุ่นใหม่');
  const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function sessionUser(){try{const s=sessionStorage.getItem('teacherbook.session');if(s)return s}catch(e){}
  try{const r=JSON.parse(LS.get('teacherbook.remember'));if(r&&r.exp>Date.now())return r.u}catch(e){}return null}
function setSession(u,remember){try{sessionStorage.setItem('teacherbook.session',u)}catch(e){}if(remember)LS.set('teacherbook.remember',JSON.stringify({u,exp:Date.now()+30*864e5}));else LS.del('teacherbook.remember')}
function start(u){USER=u;const me=users().find(x=>x.u===u);
  let d=loadUser(u);if(!d){d=seed();if(me&&me.name)d.settings.teacher=me.name}
  S=migrate(d);try{UI=JSON.parse(LS.get(uiKey(u)))||{}}catch(e){UI={}}UI.tab=UI.tab||'check';UI.week=UI.week||1;
  $('#loginView').hidden=true;$('#appHeader').hidden=false;$('#view').hidden=false;render()}
function logout(){flush();try{sessionStorage.removeItem('teacherbook.session')}catch(e){}LS.del('teacherbook.remember');USER=null;S=null;UI={};
  $('#appHeader').hidden=true;$('#view').hidden=true;$('#view').innerHTML='';showLogin('login')}

   <label class="f">ชื่อผู้ใช้<input type="text" id="lUser" autocomplete="username" autocapitalize="none" placeholder="เช่น rittikrai" required></label>

      setSession(u,false);start(u);toast('สร้างบัญชีแล้ว ยินดีต้อนรับ')
    }else{const me=users().find(x=>x.u===u);if(!me||await hashPw(pw,me.salt)!==me.hash)return err('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');

  v.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{UI.cls=b.dataset.goto;render()});
  v.querySelectorAll('[name=rkScope]').forEach(r=>r.onchange=()=>{UI.rkScope=r.value;render()});
  $('#rkTo').oninput=e=>{st.emailTo=e.target.value.trim();save()};$('#rkCc').oninput=e=>{st.emailCc=e.target.value.trim();save()};
  const get=()=>({to:$('#rkTo').value.trim(),cc:$('#rkCc').value.trim(),subject:$('#rkSub').value,body:$('#rkBody').value});
  const need=d=>{if(!d.to){toast('ใส่อีเมลผู้รับก่อน');$('#rkTo').focus();return false}return true};
  $('#rkGmail').onclick=()=>{const d=get();if(!need(d))return;const q=new URLSearchParams({view:'cm',fs:'1',to:d.to,su:d.subject,body:d.body});if(d.cc)q.set('cc',d.cc);
    window.open('https://mail.google.com/mail/?'+q.toString().replace(/\+/g,'%20'),'_blank')};
  $('#rkMail').onclick=()=>{const d=get();if(!need(d))return;location.href=`mailto:${encodeURIComponent(d.to).replace(/%2C/gi,',').replace(/%40/g,'@')}?${d.cc?'cc='+encodeURIComponent(d.cc)+'&':''}subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`};
  $('#rkCopy').onclick=()=>{const d=get();copyText(d.subject+'\n\n'+d.body,$('#rkBody'))};
  $('#rkReset').onclick=()=>render();
  $('#rkAuto').onclick=async e=>{const d=get();if(!need(d))return;const b=e.target;b.disabled=true;b.textContent='กำลังส่ง…';
    try{await fetch(st.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:st.gasKey,from:st.teacher},d))});
      toast('ส่งอีเมลแล้ว ตรวจดูได้ที่ “จดหมายที่ส่งแล้ว” ใน Gmail')}catch(err){toast('ส่งไม่สำเร็จ: ตรวจ URL Apps Script และอินเทอร์เน็ต')}
    finally{b.disabled=false;b.textContent='ส่งอัตโนมัติ'}};
}

function vNotes(v,c){

  v.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><div><h2>บันทึกหลังการสอน ${exTag(c)}</h2><p class="sub" style="margin:0">${esc(c.code)} ${esc(c.name)} · กลุ่ม ${esc(c.group)}</p></div>
   <div class="row"><button class="btn" id="uToggle">หน่วยการสอน (${c.units.length})</button><button class="btn" id="nNew">+ บันทึกครั้งใหม่</button>${c.notes.length?'<button class="btn" id="pdfAll">PDF ทุกครั้ง</button>':''}</div></div>
  ${UI.unitMgr?unitPanel(c):''}
  <div class="notes"><div class="nlist">${c.notes.map(x=>`<button class="nitem ${x.id===UI.noteId?'cur':''}" data-nid="${x.id}"><b>ครั้งที่ ${esc(x.no)} · สัปดาห์ ${esc(x.week)}</b><small>${esc(thaiDate(x.date))}<br>${esc(x.topic||'ยังไม่ระบุเรื่อง')}</small></button>`).join('')||'<div class="hint">ยังไม่มีบันทึก</div>'}</div>
  <div>${n?noteForm(c,n):'<div class="panel empty">กด “+ บันทึกครั้งใหม่” เพื่อเริ่มเขียนบันทึกหลังการสอน</div>'}</div></div></div>`;
  v.querySelectorAll('[data-nid]').forEach(b=>b.onclick=()=>{UI.noteId=b.dataset.nid;render()});
  $('#uToggle').onclick=()=>{UI.unitMgr=!UI.unitMgr;render()};
  if(UI.unitMgr)bindUnits(c);
  $('#nNew').onclick=()=>{const last=c.notes[c.notes.length-1];const nn=blankNote(c,last?{no:num(last.no)+1,week:Math.min(WEEKS,num(last.week)+1),unitId:last.unitId,unitNo:last.unitNo,unitName:last.unitName,hours:last.hours,
    methods:[...last.methods],media:[...last.media],planFull:last.planFull,fitTime:last.fitTime,learner:[...last.learner],traits:[...last.traits],evalHas:last.evalHas,evals:[...last.evals]}:{});
    c.notes.push(nn);UI.noteId=nn.id;fillAttendance(c,nn);render();toast('สร้างบันทึกใหม่ (คัดลอกตัวเลือกจากครั้งก่อน)')};
  $('#pdfAll')&&($('#pdfAll').onclick=()=>makePDF(c,c.notes,`บันทึกหลังการสอน ${c.code} ${c.group} ทุกครั้ง.pdf`));
  if(!n)return;
  const F=$('#nForm');
  F.addEventListener('input',e=>{const t=e.target,k=t.dataset.n;if(!k)return;
    if(t.type==='checkbox'){const arr=n[k];const i=arr.indexOf(t.value);t.checked?(i<0&&arr.push(t.value)):(i>=0&&arr.splice(i,1))}
    else if(t.type==='radio'){n[k]=t.value==='1'}
    else n[k]=t.value;
    if(k==='passN'||k==='failN')updPct(n);
    if(['no','week','date','topic'].includes(k)){const b=v.querySelector(`[data-nid="${n.id}"]`);b.innerHTML=`<b>ครั้งที่ ${esc(n.no)} · สัปดาห์ ${esc(n.week)}</b><small>${esc(thaiDate(n.date))}<br>${esc(n.topic||'ยังไม่ระบุเรื่อง')}</small>`}
    save()});
  $('#n_unitSel').onchange=e=>{const u=c.units.find(x=>x.id===e.target.value);n.unitId=u?u.id:'';
    if(u){n.unitNo=u.no;n.unitName=u.name;n.hours=u.hours;const tp=u.topics.split('\n').map(x=>x.trim()).filter(Boolean);
      const done=c.notes.filter(x=>x!==n&&x.unitId===u.id).map(x=>x.topic);n.topic=tp.find(x=>!done.includes(x))||tp[0]||n.topic}render()};
  $('#fillAtt').onclick=()=>{fillAttendance(c,n);render();toast(`ดึงข้อมูลจากการเช็คชื่อสัปดาห์ที่ ${n.week} แล้ว`)};
  $('#pdfOne').onclick=()=>makePDF(c,[n],`บันทึกหลังการสอน ${c.code} ${c.group} ครั้งที่ ${n.no}.pdf`);
  $('#nDel').onclick=e=>{if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='กดอีกครั้งเพื่อยืนยัน';return}c.notes=c.notes.filter(x=>x!==n);UI.noteId=null;render()};
}
function unitPanel(c){return `<div class="panel stack"><div class="row" style="justify-content:space-between"><div><b>หน่วยการสอน</b><div class="hint">เพิ่มหน่วยตามแผนการสอน แล้วเลือกใช้ในบันทึกหลังการสอนแต่ละครั้ง · เรื่องย่อยพิมพ์บรรทัดละ 1 เรื่อง</div></div><button class="btn" id="uClose">ปิด</button></div>

    <td>${c.notes.filter(n=>n.unitId===u.id).length} ครั้ง</td><td><button class="btn sm danger" data-udel>ลบ</button></td></tr>`).join('')||'<tr><td colspan="6" class="hint">ยังไม่มีหน่วยการสอน</td></tr>'}</tbody></table></div>
  <div class="row"><button class="btn pri" id="uAdd">+ เพิ่มหน่วยการสอน</button></div></div>`}
function bindUnits(c){
  $('#uClose').onclick=()=>{UI.unitMgr=false;render()};
  $('#uAdd').onclick=()=>{c.units.push({id:uid(),no:String(c.units.length+1),name:'',hours:'',topics:''});render();const ins=document.querySelectorAll('#uBody tr:last-child [data-u=name]');ins[0]?.focus()};
  $('#uBody').addEventListener('input',e=>{const tr=e.target.closest('[data-uid]');if(!tr)return;const u=c.units.find(x=>x.id===tr.dataset.uid),k=e.target.dataset.u;u[k]=e.target.value;
    const map={no:'unitNo',name:'unitName',hours:'hours'};if(map[k])c.notes.filter(n=>n.unitId===u.id).forEach(n=>n[map[k]]=u[k]);
    const o=document.querySelector(`#n_unitSel option[value="${u.id}"]`);if(o)o.textContent=`หน่วยที่ ${u.no} ${u.name}`;

  $('#uBody').addEventListener('click',e=>{if(!e.target.hasAttribute('data-udel'))return;if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='ยืนยันลบ';return}
    const id=e.target.closest('[data-uid]').dataset.uid;c.units=c.units.filter(x=>x.id!==id);c.notes.forEach(n=>{if(n.unitId===id)n.unitId=''});render()});

function updPct(n){const p=num(n.passN),f=num(n.failN),t=p+f;const el=$('#pctOut');if(el)el.textContent=t?`ผ่าน ${fmt(p*100/t)}% · ไม่ผ่าน ${fmt(f*100/t)}%`:''}
function fillAttendance(c,n){const w=n.week;const pres=[],abs=[];
  c.students.forEach(s=>{const a=attOf(c,s,w);if(a==='/'||a==='ส')pres.push(s);else if(a==='ข'||a==='ล')abs.push({s,a})});
  n.presentN=String(pres.length);n.absentN=String(abs.length);
  n.presentText=pres.length===c.students.length&&pres.length?'นักเรียนเข้าเรียนครบทุกคน':pres.length?`มาเรียน ${pres.length} คน`+(pres.some(s=>attOf(c,s,w)==='ส')?` (มาสาย: ${pres.filter(s=>attOf(c,s,w)==='ส').map(s=>s.name).join(', ')})`:''):'';
  n.absentText=abs.length?abs.map(({s,a})=>`${s.name}${a==='ล'?' (ลา)':' (ขาด)'}`).join(', '):'-';
  n.group=n.group||c.group}

let busy=false;
async function makePDF(c,notes,fname){
  if(busy)return;if(typeof html2pdf==='undefined')return toast('โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วเปิดหน้าใหม่');
  busy=true;toast('กำลังสร้าง PDF…');
  const stage=$('#pdfStage');stage.innerHTML='<div id="pdfRoot" style="width:210mm;background:#fff">'+notes.map((n,i)=>`<div class="${i?'pg-break':''}">${notePage(c,n)}</div>`).join('')+'</div>';
  try{await document.fonts.ready;
    // shrink a page that would overflow A4 so each note stays on one sheet
    stage.querySelectorAll('.a4').forEach(pg=>{const max=pg.offsetWidth*297/210;if(pg.scrollHeight>max){pg.style.fontSize=(14.5*Math.max(.78,max/pg.scrollHeight)).toFixed(2)+'px'}pg.style.height=(max-2)+'px';pg.style.overflow='hidden'});
    await html2pdf().set({margin:0,filename:fname,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css'],before:'.pg-break'}}).from($('#pdfRoot')).save();
    toast('ดาวน์โหลด PDF แล้ว')}catch(e){console.error(e);toast('สร้าง PDF ไม่สำเร็จ: '+e.message)}
  finally{stage.innerHTML='';busy=false}
}

  const RR=st.risk,rl=riskList(c);
  mput(rk,1,1,1,9,st.college,{size:18,bold:true});mput(rk,2,1,2,9,'รายงานนักเรียนกลุ่มเสี่ยง',{size:16,bold:true});
  mput(rk,3,1,3,9,`รหัสวิชา ${c.code}   ชื่อวิชา ${c.name}   กลุ่มเรียน ${c.group}   ภาคเรียนที่ ${term}/${yr}   ครูผู้สอน ${st.teacher}`,{size:14,h:'left'});
  mput(rk,4,1,4,9,`ข้อมูล ณ วันที่ ${thaiDate(today())}  (เช็คชื่อแล้ว ${heldWeeks(c).length} สัปดาห์)   เกณฑ์: เวลาเรียนต่ำกว่า ${RR.att}%, คะแนนเก็บต่ำกว่า ${RR.score}%, ค้างงานตั้งแต่ ${RR.missing} ชิ้น, ขาดติดต่อกันตั้งแต่ ${RR.run} สัปดาห์`,{size:13,h:'left',wrap:true});
  rk.getRow(4).height=36;
  ['ที่','รหัสประจำตัว','ชื่อ-นามสกุล','ระดับ','เวลาเรียน','ขาด/ลา','งานค้าง','คะแนนเก็บ','สาเหตุ'].forEach((t,i)=>put(rk,6,i+1,t,{size:14,bold:true,border:true,fill:'FFEFF3F8'}));
  let kr=7;
  if(!rl.length){mput(rk,kr,1,kr,9,'ไม่มีนักเรียนกลุ่มเสี่ยง',{size:14,border:true});kr++}
  rl.forEach((x,k)=>{const f=x.r.level===2?'FFFBE2E0':'FFFBF0D2';
    [k+1,x.s.sid,x.s.name,LV[x.r.level],x.r.attPct==null?'-':fmt1(x.r.attPct)+'%',`${x.r.abs}/${x.r.leave}`,x.r.missing,x.r.scPct==null?'-':fmt1(x.r.scPct)+'%',x.r.reasons.join('\n')]
      .forEach((v,i)=>put(rk,kr,i+1,v,{size:14,border:true,h:i===2||i===8?'left':'center',wrap:i===8,fill:i===3?f:undefined,bold:i===3}));
    rk.getRow(kr).height=Math.max(21,19*x.r.reasons.length);kr++});
  kr+=2;mput(rk,kr,1,kr,4,'ลงชื่อ.......................................................ครูผู้สอน',{size:14});mput(rk,kr,6,kr,9,`ลงชื่อ.......................................................${headTitle()}`,{size:14});kr++;mput(rk,kr,1,kr,4,`( ${st.teacher} )`,{size:14});mput(rk,kr,6,kr,9,`( ${headOf(c)||'.......................................................'} )`,{size:14});

  const buf=await wb.xlsx.writeBuffer();
  download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`แบบฟอร์มวัดผล ${c.code} ${c.name} ${c.group} ภาคเรียนที่ ${term}-${yr}.xlsx`);
  toast('ดาวน์โหลด Excel แล้ว (หน้าปก + เวลาเรียน/คะแนน + จิตพิสัย + กลุ่มเสี่ยง)');
}

boot();
</script>
